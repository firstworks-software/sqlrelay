<?xml version="1.0"?>
<instances>

	<!-- for #9174 step 3: a standalone instance for the ociselecttest
	     repro script.  Not test/sqlrelay.conf.d/oracleprotocol.conf's
	     oracleprotocol instance, because that one's connection
	     string names the backend host as "oracle", which isn't
	     resolvable on this host - this one points at the same live
	     12.2 test server jdbcoracletest uses instead (see the README).
	     serverversion="11.2" is required: OCI 23.26, in the portable
	     encoding, reads only the 11.2 summary-object shape. -->
	<instance id="ociselecttest" dbase="oracle" debug="protocols">
		<listeners>
			<listener protocol="oracle" port="15320" serverversion="11.2" sid="ora1"/>
		</listeners>
		<auths>
			<auth module="oracle_userlist">
				<user user="testuser" password="testpassword"/>
			</auth>
		</auths>
		<connections>
			<connection string="oracle_sid=(DESCRIPTION = (ADDRESS = (PROTOCOL = TCP)(HOST = oracle122centos7x64.firstworks.com)(PORT = 1521)) (CONNECT_DATA = (SERVER = DEDICATED) (SERVICE_NAME = ora1)));user=testuser;password=testpassword"/>
		</connections>
	</instance>

</instances>
