<?xml version="1.0"?>
<instances>

	<!-- for #9635 step 1: a standalone instance for the mixedtypetest
	     repro script, reproducing an OCI client and a python-oracledb
	     thin client both hanging on a mixed VARCHAR+NUMBER result set
	     (either column order) - see mixedtypetest.

	     One listener serves both clients, at the default
	     serverversion (12.1).  Don't set serverversion="11.2" here:
	     python-oracledb doesn't support an Oracle server older than
	     12.1 at all, and against serverversion="11.2" it hangs
	     forever at login, with no error, which is a different hang
	     than the one #9635 is about but looks identical from the
	     client side.

	     Points at the live oracle122 test server (see the README)
	     rather than at "oracle", the hostname
	     test/sqlrelay.conf.d/oracleprotocol.conf.in uses - "oracle"
	     isn't resolvable on every host this repro needs to run on.

	     The debug logger tag makes the debug="protocols" output land
	     in files under the debug directory (usually
	     /usr/local/firstworks/var/log/sqlrelay/debug), named
	     sqlr-listener.PID and sqlr-connection.PID, rather than
	     relying on the daemonized listener/connection processes still
	     having a usable standard output after sqlr-start detaches
	     them. -->
	<instance id="mixedtypetest" dbase="oracle" debug="protocols">
		<listeners>
			<listener protocol="oracle" port="15340" sid="ora1"/>
		</listeners>
		<loggers>
			<logger module="debug"/>
		</loggers>
		<auths>
			<auth module="oracle_userlist">
				<user user="testuser" password="testpassword"/>
			</auth>
		</auths>
		<connections>
			<connection string="oracle_sid=(DESCRIPTION = (ADDRESS = (PROTOCOL = TCP)(HOST = oracle122centos7x64.firstworks.com)(PORT = 1521)) (CONNECT_DATA = (SERVER = DEDICATED) (SERVICE_NAME = ora1)));user=testuser;password=testpassword"/>
		</connections>
	</instance>

</instances>
