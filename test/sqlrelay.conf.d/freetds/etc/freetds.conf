[global]
	tds version = auto

[sap]
	host = sap
	port = 5000
	;tds version = 5.0

[mssql2005]
	host = mssql2005
	port = 1433

[mssql2008]
	host = mssql2008
	port = 1433

[mssql2012]
	host = mssql2012
	port = 1433

[mssql2014]
	host = mssql2014
	port = 1433

[mssql2016]
	host = mssql2016
	port = 1433

; the tds protocol test uses these three - the two backends it establishes a
; native baseline against, and sqlrelay's own tds protocol module

[mssql]
	host = mssql
	port = 1433

[sybase]
	host = sybase
	port = 5000

[sqlrelay]
	host = localhost
	port = 1433
	tds version = 7.0
	client charset = UTF-8

; the tls scripts in test/protocol/tds drive these.  freetds takes its tls
; settings from here rather than from the client command line.  there is no
; mutual auth entry - freetds cannot present a client certificate

[sqlrelaytls]
	host = localhost
	port = 1433
	tds version = 7.0
	client charset = UTF-8
	encryption = require

[sqlrelaytlsserverauth]
	host = localhost
	port = 1433
	tds version = 7.0
	client charset = UTF-8
	encryption = require
	ca file = /usr/local/firstworks/etc/sqlrelay.conf.d/ca.pem
	check certificate hostname = yes
