<?xml version="1.0"?>
<instances>
	<instance id="example" dbase="odbc" translatebindvariables="yes">
		<listeners>
			<listener protocol="teradata" port="1025"/>
		</listeners>
		<auths>
			<auth module="teradata_sidechannel" host="teradatahost" port="1025"/>
		</auths>
		<connections>
			<connection string="dsn=teradata;user=teradatauser;password=teradatapassword;autocommit=yes"/>
		</connections>
	</instance>
</instances>
