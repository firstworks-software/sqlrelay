<?xml version="1.0"?>
<instances>
	...
	<instance id="example" ... >
		...
		<querytranslations>
			<querytranslation module="normalize"/>
			<querytranslation module="patterns">
				<pattern type="regex"
					match="^create table .*">
					<pattern type="string"
						from=" tinytext,"
						to=" varchar2(254),"/>
					<pattern type="string"
						from=" mediumtext,"
						to=" varchar2(1023),"/>
					<pattern type="string"
						from=" longtext,"
						to=" clob,"/>
				</pattern>
				<pattern type="regex"
					match="^select .*,oldvalue,newvalue,.* from ticket_change .* union .*">
					<pattern type="string"
						from=",oldvalue,newvalue,"
						to=",to_char(oldvalue),to_char(newvalue),"/>
				</pattern>
			</querytranslation>
		</querytranslations>
		...
	</instance>
	...
</instances>
