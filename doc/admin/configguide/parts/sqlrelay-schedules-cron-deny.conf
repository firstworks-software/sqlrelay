<?xml version="1.0"?>
<instances>
	<instance ...>
		...
		<schedules>
			<!-- allow these users during business hours -->
			<schedule module="cron_userlist" default="deny">
				<users>
					<user user="bob"/>
					<user user="sally"/>
					<user user="joe"/>
					<user user="mary"/>
				</users>
				<rules>
					<allow when="* * * 2-5 8:00-11:59,13:00-16:59"/>
				</rule>
			</schedule>
		</schedules>
		...
	</instance>
</instances>
